<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="entire-window">
        <div id="header">
            <h1>Snake Game</h1>
        </div>
        <div id="score-container">
            <h2>Current Score: <span id="current-score-span"></span></h2>
            <h2>Best Score: <span id="best-score-span"></span></h2>
        </div>
        <div id="canvas-container">
            <canvas id="canvas"></canvas>
        </div>
        <div id="footer">Shubhapriya Sadhukhan</div>
        <div id="game-lost-div">You Lost</div>
        <div id="game-won-div">You won</div>
    </div>
    <script src="index.js" type="module"></script>
</body>
</html>
